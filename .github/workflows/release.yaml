name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Dependencies
        run: pip install beautifulsoup4

      - name: Run Release
        run: python3 scripts/release.py
